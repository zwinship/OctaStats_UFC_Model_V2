name: Diagnostic — live source check (temporary)

# Read-only: fetches UFCStats / BestFightOdds / DraftKings / Gambly and prints
# what it sees. No secrets, no GitHub writes. Runs only on the Claude branch.
on:
  push:
    branches: [claude/tender-cori-w44tcz]
    paths:
      - scripts/diag_live_sources.py
      - .github/workflows/diag_live_sources.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install requests beautifulsoup4 lxml pandas numpy scipy scikit-learn tqdm playwright
          python -m playwright install --with-deps chromium
      - run: python -u scripts/diag_live_sources.py
        env:
          # read-only token (permissions: contents: read) — avoids the
          # anonymous API rate limit; cannot push anything
          ZWINSHIP_PAT: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag_out
          path: diag_out/
